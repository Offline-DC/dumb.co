name: Deploy dumb.co to GitHub Pages

# Every push to main -- including every save in Pages CMS while it is pointed
# at main -- builds the site with Astro and publishes dist/ to dumb.co.

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22      # Astro needs 22.12+
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `astro build` writes one HTML file per page (shop.html answers /shop
      # with a 200 on GitHub Pages), plus the sitemap and a real 404 page.
      - name: Check the build produced the pages
        run: |
          for f in index shop about community press memories faq contact internship support 404; do
            test -f "dist/$f.html" || { echo "missing dist/$f.html"; exit 1; }
          done
          test -f dist/sitemap-index.xml
          test -f dist/robots.txt
          grep -q 'FAQPage' dist/faq.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: dumb.co
          force_orphan: true
