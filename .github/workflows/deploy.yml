name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # `npm run build` is `vite build && node scripts/prerender.mjs`, and the
      # prerender step writes a real file for every route in scripts/routes.mjs
      # (so GitHub Pages answers 200 instead of the 404 the old
      # `cp index.html 404.html` trick produced), plus sitemap.xml, robots.txt
      # and a 404.html for paths that genuinely don't exist.
      - name: Check the build produced the routes
        run: |
          test -f dist/index.html
          test -f dist/press/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/404.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: dumb.co
          force_orphan: true
